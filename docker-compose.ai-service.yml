# ==============================================================================
# EnglishHub - Standalone AI Service Docker Compose (FastAPI)
# ==============================================================================
# Chạy riêng AI Microservice (không kéo theo Postgres/Backend/Frontend).
# Service này được chia sẻ chung cho Production VÀ Staging: backend prod/staging
# gọi qua http://ai-service:8001 trên network external "englishhub_shared".
#
# Hướng dẫn chạy (AI service dùng env file RIÊNG, tách khỏi .env của backend):
# 1. Tạo network chung (nếu chưa có):
#      docker network create englishhub_shared
# 2. Tạo env file riêng cho AI service:
#      cp env.ai-service.example ai-service/.env
# 3. Điền OPENROUTER_API_KEY (hoặc GEMINI_API_KEY) vào ai-service/.env
# 4. Chạy (đọc env bằng --env-file, KHÔNG dùng .env ở root):
#      docker compose --env-file ai-service/.env -f docker-compose.ai-service.yml up -d --build
# 5. Kiểm tra:
#      curl http://localhost:8001/health
#      Mở Swagger: http://localhost:8001/docs
#
# Nếu AI service chạy ở máy khác với backend:
#   - Set AI_SERVICE_BASE_URL=http://<host>:<AI_SERVICE_PORT> (ví dụ http://192.168.1.10:8001)
# ==============================================================================

services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: ${AI_SERVICE_IMAGE:-englishhub-ai-service:latest}
    container_name: englishhub-ai-service
    restart: unless-stopped
    environment:
      PORT: 8001
      # Chiến lược chọn AI provider: "auto" | "openrouter" | "gemini"
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      # OpenRouter (multi-model gateway)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      # Google Gemini Direct (fallback)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Mock mode: true = chạy offline với QA-21 fixed benchmark (không cần API key)
      MOCK_MODE: ${AI_SERVICE_MOCK_MODE:-false}
      # Network & timeout
      REQUEST_TIMEOUT_SECONDS: ${AI_SERVICE_REQUEST_TIMEOUT_SECONDS:-60}
      MAX_RETRIES: ${AI_SERVICE_MAX_RETRIES:-2}
      # Danh sách domain frontend được phép gọi API, phân tách bởi dấu phẩy. "*" = cho phép tất cả.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - englishhub_ai_network
      - englishhub_shared

networks:
  englishhub_ai_network:
    name: englishhub_ai_network
    driver: bridge
  # Network chung với stack backend prod/staging (tạo trước: docker network create englishhub_shared)
  englishhub_shared:
    external: true
