# ==============================================================================
# EnglishHub - Production Docker Compose (Self-Host PC)
# ==============================================================================
# Hướng dẫn chạy:
# 1. Tạo file .env từ env.production.example: cp env.production.example .env
# 2. Điền thông tin kết nối Neon DB, JWT_SECRET vào .env
# 3. Chạy backend:
#      docker compose -f docker-compose.prod.yml up -d
# 4. (Tùy chọn) Chạy cả Cloudflare Tunnel qua Docker (nếu không cài tunnel app trên OS):
#      docker compose -f docker-compose.prod.yml --profile cloudflare up -d
# ==============================================================================

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/hotung9108/englishhub/backend:latest}
    container_name: englishhub-backend-prod
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Kết nối trực tiếp tới Neon PostgreSQL Serverless (bắt buộc sslmode=require)
      SPRING_DATASOURCE_URL: ${DB_URL:?Database connection URL (DB_URL) is required}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?Database username (DB_USER) is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Database password (DB_PASSWORD) is required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret key is required}
      # Danh sách domain frontend được phép gọi API, phân tách bởi dấu phẩy.
      # "*" = cho phép tất cả các origin (mặc định). Nên giới hạn theo domain thật khi đưa vào dùng.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Giới hạn RAM JVM cho Spring Boot để tối ưu tài nguyên máy tính cá nhân
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms256m -Xmx768m}"
      # Cấu hính thông tin S3-Compatible Storage cho backend
      STORAGE_S3_ENABLED: ${STORAGE_S3_ENABLED:-true}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-true}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8001}
      SERVER_PORT: ${SERVER_PORT:-8080}
    networks:
      - englishhub_network
      - englishhub_shared
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-service:
    image: ${AI_SERVICE_IMAGE:-ghcr.io/hotung9108/englishhub/ai-service:latest}
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: englishhub-ai-service-prod
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    environment:
      PORT: 8001
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MOCK_MODE: ${AI_SERVICE_MOCK_MODE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    networks:
      - englishhub_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cloudflare Tunnel Container (Tùy chọn: dùng profile cloudflare nếu muốn chạy qua docker)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: englishhub-tunnel-prod
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - englishhub_network
    profiles:
      - cloudflare

networks:
  englishhub_network:
    driver: bridge
  englishhub_shared:
    external: true
