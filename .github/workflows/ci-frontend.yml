name: CI-Frontend

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck UI Tests
        run: npm run test:ui:types

      - name: Run UI Component Tests and Coverage Gate (>= 80%)
        run: npm run test:ui

      - name: Upload Vitest Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Publish Frontend Coverage Summary
        if: always()
        run: |
          echo "### Frontend CI & Coverage Gate" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "Vitest coverage passed threshold (>= 80% per configured file)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Production Bundle (Typecheck & Vite)
        run: npm run build
