name: CI-Backend

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Backend (Spring Boot)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: englishhub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d englishhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Pre-pull Testcontainers Images
        run: |
          docker pull localstack/localstack:3
          docker pull postgres:16-alpine

      - name: Validate Flyway Migrations & Run Tests with JaCoCo Coverage Gate
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/englishhub_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: testpassword
          SPRING_FLYWAY_ENABLED: true
          STORAGE_S3_ENABLED: false
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-coverage-report
          path: backend/build/reports/jacoco/test/html/
          retention-days: 14

      - name: Publish Backend Coverage Summary
        if: always()
        run: |
          echo "### Backend CI & Code Coverage Gate" >> $GITHUB_STEP_SUMMARY
          if [ -f build/reports/jacoco/test/jacocoTestReport.xml ]; then
            echo "JaCoCo coverage verification passed threshold (>= 80%)." >> $GITHUB_STEP_SUMMARY
            echo "Report artifact generated and uploaded." >> $GITHUB_STEP_SUMMARY
          else
            echo "JaCoCo XML report was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Application Jar
        run: ./gradlew bootJar -x test --no-daemon
