name: PR Convention Linter

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr:
    name: Validate PR Title, Branch & Traceability
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -c '
          import re, os, sys
          title = os.environ.get("PR_TITLE", "").strip()
          print(f"Checking PR Title: {title}")
          pattern = r"^(feat|fix|docs|ci|test|refactor|perf|chore)\([A-Za-z0-9_\-\/]+\): .+"
          if not re.match(pattern, title):
              print(f"::error file=.github/workflows/pr-convention-lint.yml::PR Title \"{title}\" does not match Conventional Commits format! Example valid: \"feat(FE-84): build audio recording player\"")
              sys.exit(1)
          print("PR Title matches convention.")
          '

      - name: Validate Source Branch Naming
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          python3 -c '
          import re, os, sys
          head = os.environ.get("HEAD_BRANCH", "").strip()
          base = os.environ.get("BASE_BRANCH", "").strip()
          print(f"Checking Source Branch: {head} targeting {base}")
          if (head == "develop" and base == "staging") or (head == "staging" and base == "main"):
              print("Promotion branch. Allowed.")
              sys.exit(0)
          pattern = r"^(feature|feat|fix|bugfix|hotfix|docs|ci|refactor|test)\/([a-zA-Z0-9_\-\.]+)$"
          if not re.match(pattern, head):
              print(f"::error file=.github/workflows/pr-convention-lint.yml::Branch name \"{head}\" does not follow convention! Example valid: \"feature/FE-84-audio-player\" or \"fix/BE-64-soft-delete-token\"")
              sys.exit(1)
          print("Source branch name matches convention.")
          '

      - name: Validate PR Body (Trello Link / Work Items)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 -c '
          import re, os
          body = os.environ.get("PR_BODY", "")
          print("Checking PR Body for Trello Card link or task ID...")
          if "trello.com" in body or re.search(r"\[(FE|BE|OPS|QA|DOC)-[0-9]+\]", body):
              print("Traceability reference found in PR description.")
          else:
              print("::warning file=.github/workflows/pr-convention-lint.yml::PR Description is missing a Trello Card link or task reference! Please add your Trello card link for traceability.")
          '

      - name: Publish Quality Gate Summary
        if: always()
        run: |
          echo "### PR Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Title Format | \`${{ github.event.pull_request.title }}\` | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Source Branch Format | \`${{ github.head_ref }}\` | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Branch | \`${{ github.base_ref }}\` | Valid |" >> $GITHUB_STEP_SUMMARY
