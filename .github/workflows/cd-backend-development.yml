name: CD-Backend-Staging

# CD cho Backend (development/staging) trên nhánh staging.
#
# Trigger: push vào staging có thay đổi backend/** (cùng paths filter với Backend CI),
# nên CD chạy đúng lúc code Backend thay đổi và không phụ thuộc event workflow_run.
#
# Thứ tự deploy do 2 job chờ (chạy song song), deploy cần cả hai:
#   wait-for-backend-ci : poll "Backend CI" cho tới khi hoàn tất thành công
#                         tại commit này (cơ chế giống job wait-ai-service).
#   wait-ai-service     : chờ AI Service CI + "Deploy AI Service" hoàn tất
#                         (nếu push này có thay đổi ai-service/**).
on:
  push:
    branches:
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

env:
  IMAGE_NAME: ghcr.io/hotung9108/english-hub-backend

jobs:
  wait-for-backend-ci:
    name: Wait for Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read

    steps:
      - name: Wait for Backend CI when backend was changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CI_WORKFLOW: ci-backend.yml
        run: |
          set -euo pipefail

          POLL_INTERVAL=15
          DEADLINE=$((SECONDS + 1500)) # 25 phút

          echo "Waiting for Backend CI ($SHA) ..."
          ci_conclusion=""
          while [ -z "$ci_conclusion" ]; do
            ci_conclusion=$(gh api "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$SHA&status=completed&per_page=5" \
              --jq '.workflow_runs[0].conclusion // empty' 2>/dev/null || true)
            if [ -z "$ci_conclusion" ]; then
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "::error::Timed out waiting for Backend CI ($SHA)"
                exit 1
              fi
              sleep "$POLL_INTERVAL"
            fi
          done

          if [ "$ci_conclusion" != "success" ]; then
            echo "::error::Backend CI concluded '$ci_conclusion' for $SHA — blocking backend deploy."
            exit 1
          fi

          echo "Backend CI passed ($SHA)."

  wait-ai-service:
    name: Wait for AI Service CI & CD
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read

    steps:
      - name: Wait for AI Service pipeline when ai-service was changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          POLL_INTERVAL=15
          DEADLINE=$((SECONDS + 1200)) # 20 phút
          AI_CI="ci-ai-service.yml"
          AI_CD="cd-ai-service.yml"

          # "AI Service CI" chỉ chạy khi push có thay đổi trong ai-service/**,
          # nên nếu không có run nào tại commit này = không thay đổi AI service = không cần chờ.
          ai_ci_count=$(gh api "repos/$REPO/actions/workflows/$AI_CI/runs?head_sha=$SHA&per_page=1" \
            --jq '.total_count' 2>/dev/null || echo 0)

          if [ "$ai_ci_count" = "0" ]; then
            echo "::notice::No AI Service CI run for $SHA — ai-service not changed, nothing to wait for."
            exit 0
          fi

          echo "ai-service was changed in this push. Waiting for AI Service CI ($SHA) ..."
          ai_ci_conclusion=""
          while [ -z "$ai_ci_conclusion" ]; do
            ai_ci_conclusion=$(gh api "repos/$REPO/actions/workflows/$AI_CI/runs?head_sha=$SHA&status=completed&per_page=5" \
              --jq '.workflow_runs[0].conclusion // empty' 2>/dev/null || true)
            if [ -z "$ai_ci_conclusion" ]; then
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "::error::Timed out waiting for AI Service CI ($SHA)"
                exit 1
              fi
              sleep "$POLL_INTERVAL"
            fi
          done

          if [ "$ai_ci_conclusion" != "success" ]; then
            echo "::error::AI Service CI concluded '$ai_ci_conclusion' for $SHA — blocking backend deploy."
            exit 1
          fi

          echo "AI Service CI passed. Waiting for 'Deploy AI Service' ($SHA) ..."
          ai_cd_conclusion=""
          while [ -z "$ai_cd_conclusion" ]; do
            ai_cd_conclusion=$(gh api "repos/$REPO/actions/workflows/$AI_CD/runs?head_sha=$SHA&status=completed&per_page=5" \
              --jq '.workflow_runs[0].conclusion // empty' 2>/dev/null || true)
            if [ -z "$ai_cd_conclusion" ]; then
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "::error::Timed out waiting for Deploy AI Service ($SHA)"
                exit 1
              fi
              sleep "$POLL_INTERVAL"
            fi
          done

          if [ "$ai_cd_conclusion" != "success" ]; then
            echo "::error::Deploy AI Service concluded '$ai_cd_conclusion' for $SHA — blocking backend deploy."
            exit 1
          fi

          echo "AI Service deployed ($SHA). Backend deploy can proceed."

  deploy:
    name: Build & Deploy Backend
    needs:
      - wait-for-backend-ci
      - wait-ai-service
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      # Push event: github.sha chính là commit được push (= commit CI vừa test)
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false
          timeout: 10m
          retry: 3
        continue-on-error: true

      - name: Show Tailscale diagnostics
        if: steps.tailscale.outcome == 'failure'
        run: |
          sudo cat ~/tailscaled.log || true
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context trỏ vào thư mục backend/ nơi có Dockerfile
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_NAME,DEPLOY_SHA
          timeout: 2m
          command_timeout: 60m
          script: |
            # Đăng nhập GHCR để pull image
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io \
              -u ${{ secrets.SERVER_USER }} --password-stdin

            # Pull image mới về trước
            docker pull $IMAGE_NAME:$DEPLOY_SHA

            # Đảm bảo network chung tồn tại (tunnel + backend đều cần)
            docker network inspect englishhub_shared >/dev/null 2>&1 \
              || docker network create englishhub_shared >/dev/null

            # Khởi động Cloudflare Tunnel trước khi khởi động Backend
            cd /home/${{ secrets.SERVER_USER }}/tunnel
            docker compose -f docker-compose.tunnel.yml up -d Tunnel

            # Cập nhật BACKEND_IMAGE trong .env để compose dùng đúng tag
            cd /home/${{ secrets.SERVER_USER }}/englishhub-dev
            sed -i "s|BACKEND_IMAGE=.*|BACKEND_IMAGE=$IMAGE_NAME:$DEPLOY_SHA|" .env

            # Thay thế container
            docker compose -f docker-compose.staging.yml up -d --pull always

            # Xóa image cũ không dùng nữa
            docker image prune -f
