name: Deploy AI Service to VPS/Home-Server

# CD cho AI service trên nhánh main (production) và staging (development).
#
# Trigger: push vào main/staging có thay đổi ai-service/** (cùng paths filter
# với AI Service CI), nên CD chạy đúng lúc code AI service thay đổi
# và không phụ thuộc event workflow_run.
#
# Job "wait-for-ai-ci" đảm bảo thứ tự: AI Service CI xong (đạt success) → Deploy.
# Job deploy chỉ chạy khi cả hai job chờ đều thành công.
#
# Thư mục trên server: /home/<SERVER_USER>/ai-service
# (docker-compose.ai-service.yml + env file riêng, xem env.ai-service.example)
on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'ai-service/**'
      - '.github/workflows/ci-ai-service.yml'

env:
  IMAGE_NAME: ghcr.io/hotung9108/english-hub-ai-service

jobs:
  wait-for-ai-ci:
    name: Wait for AI Service CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read

    steps:
      - name: Wait for AI Service CI when ai-service was changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CI_WORKFLOW: ci-ai-service.yml
        run: |
          set -euo pipefail

          POLL_INTERVAL=15
          DEADLINE=$((SECONDS + 1500)) # 25 phút

          echo "Waiting for AI Service CI ($SHA) ..."
          ci_conclusion=""
          while [ -z "$ci_conclusion" ]; do
            ci_conclusion=$(gh api "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$SHA&status=completed&per_page=5" \
              --jq '.workflow_runs[0].conclusion // empty' 2>/dev/null || true)
            if [ -z "$ci_conclusion" ]; then
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "::error::Timed out waiting for AI Service CI ($SHA)"
                exit 1
              fi
              sleep "$POLL_INTERVAL"
            fi
          done

          if [ "$ci_conclusion" != "success" ]; then
            echo "::error::AI Service CI concluded '$ci_conclusion' for $SHA — blocking AI service deploy."
            exit 1
          fi

          echo "AI Service CI passed ($SHA). Deploy can proceed."

  deploy:
    name: Build & Deploy AI Service
    needs: wait-for-ai-ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      # Push event: github.sha chính là commit được push (= commit CI vừa test)
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code (commit vừa push)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false
          timeout: 10m
          retry: 3
        continue-on-error: true

      - name: Show Tailscale diagnostics
        if: steps.tailscale.outcome == 'failure'
        run: |
          sudo cat ~/tailscaled.log || true
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context trỏ vào thư mục ai-service/ nơi có Dockerfile
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_NAME,DEPLOY_SHA
          timeout: 2m
          command_timeout: 60m
          script: |
            # Đăng nhập GHCR để pull image
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io \
              -u ${{ secrets.SERVER_USER }} --password-stdin

            # Pull image mới về trước
            docker pull $IMAGE_NAME:$DEPLOY_SHA

            # Cập nhật AI_SERVICE_IMAGE trong .env để compose dùng đúng tag
            cd /home/${{ secrets.SERVER_USER }}/ai-service
            [ -f .env ] || cp env.ai-service.example .env
            sed -i "s|AI_SERVICE_IMAGE=.*|AI_SERVICE_IMAGE=$IMAGE_NAME:$DEPLOY_SHA|" .env

            # Network chung với backend prod/staging (backend gọi http://ai-service:8001)
            docker network inspect englishhub_shared >/dev/null 2>&1 \
              || docker network create englishhub_shared

            # Thay thế container (--no-build: image đã build trên CI)
            docker compose -f docker-compose.ai-service.yml up -d --no-build --pull always

            # Xóa image cũ không dùng nữa
            docker image prune -f
