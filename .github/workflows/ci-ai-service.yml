name: CI-AI-Service

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'ai-service/**'
      - '.github/workflows/ci-ai-service.yml'
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'ai-service/**'
      - '.github/workflows/ci-ai-service.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build AI Service (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Lint Code with Ruff
        run: ruff check app/ tests/

      # tests/conftest.py tự bật MOCK_MODE nên không cần API key
      - name: Run Tests with Coverage Gate (>= 80%)
        run: pytest -v --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Upload AI Service Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-coverage-report
          path: ai-service/coverage.xml
          retention-days: 14

      - name: Publish AI Service Summary
        if: always()
        run: |
          echo "### AI Service CI & Coverage Gate" >> $GITHUB_STEP_SUMMARY
          echo "Pytest test suite & coverage gate (>= 80%) executed." >> $GITHUB_STEP_SUMMARY

      - name: Build AI Service image
        run: docker build -t ai-service:ci-test .

      - name: Validate ffmpeg trong image
        run: docker run --rm ai-service:ci-test ffmpeg -version
