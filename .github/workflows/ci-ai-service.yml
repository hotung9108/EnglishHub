name: CI-AI-Service

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'ai-service/**'
      - '.github/workflows/ci-ai-service.yml'
  pull_request:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'ai-service/**'
      - '.github/workflows/ci-ai-service.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build AI Service (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # tests/conftest.py tự bật MOCK_MODE nên không cần API key
      - name: Run Tests (including WebM/OGG transcode)
        run: pytest -v

      - name: Build AI Service image
        run: docker build -t ai-service:ci-test .

      - name: Validate ffmpeg and transcode in container
        run: |
          docker run --rm ai-service:ci-test ffmpeg -version
          docker run --rm ai-service:ci-test pytest -v tests/test_audio_processor_ffmpeg.py
