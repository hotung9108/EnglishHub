name: CD-Frontend-Staging

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  wait-for-frontend-ci:
    name: Wait for Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read

    steps:
      - name: Wait for Frontend CI when frontend was changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CI_WORKFLOW: ci-frontend.yml
        run: |
          set -euo pipefail

          POLL_INTERVAL=15
          DEADLINE=$((SECONDS + 1500)) # 25 phút

          echo "Waiting for Frontend CI ($SHA) ..."
          ci_conclusion=""
          while [ -z "$ci_conclusion" ]; do
            ci_conclusion=$(gh api "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$SHA&status=completed&per_page=5" \
              --jq '.workflow_runs[0].conclusion // empty' 2>/dev/null || true)
            if [ -z "$ci_conclusion" ]; then
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                echo "::error::Timed out waiting for Frontend CI ($SHA)"
                exit 1
              fi
              sleep "$POLL_INTERVAL"
            fi
          done

          if [ "$ci_conclusion" != "success" ]; then
            echo "::error::Frontend CI concluded '$ci_conclusion' for $SHA — blocking frontend deploy."
            exit 1
          fi

          echo "Frontend CI passed ($SHA)."

  deploy:
    name: Build & Deploy Frontend
    needs:
      - wait-for-frontend-ci
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Lấy source code từ repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Cài Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Cài dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Kiểm tra lint
      - name: Lint
        run: npm run lint

      # 5. Chạy test nếu project có test
      - name: Test
        run: npm run test --if-present

      # 6. Cài Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 7. Lấy configuration và environment variables từ Vercel
      - name: Pull Vercel configuration
        run: rm -rf .vercel && vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_DEV }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}

      # 8. Build project trên GitHub Actions
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_DEV }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}

      # 9. Deploy build output lên Vercel
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_DEV }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}