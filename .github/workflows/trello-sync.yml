name: Trello Auto-Sync Bot

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
    branches:
      - develop
      - staging

permissions:
  pull-requests: read
  contents: read

jobs:
  sync-trello:
    name: Sync PR Status to Trello
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Sync Trello Card
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
          TRELLO_BOARD_ID: ${{ vars.TRELLO_BOARD_ID || '6a7f2e4b7b1d207eee516457' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import sys

          api_key = os.environ.get("TRELLO_API_KEY")
          api_token = os.environ.get("TRELLO_API_TOKEN")
          board_id = os.environ.get("TRELLO_BOARD_ID", "6a7f2e4b7b1d207eee516457")
          pr_title = os.environ.get("PR_TITLE", "")
          pr_branch = os.environ.get("PR_BRANCH", "")
          pr_url = os.environ.get("PR_URL", "")
          pr_number = os.environ.get("PR_NUMBER", "")
          pr_action = os.environ.get("PR_ACTION", "")
          pr_merged = os.environ.get("PR_MERGED", "false").lower() == "true"
          pr_user = os.environ.get("PR_USER", "")
          pr_base = os.environ.get("PR_BASE", "develop")
          pr_body = os.environ.get("PR_BODY", "")

          if not api_key or not api_token:
              print("Notice: TRELLO_API_KEY or TRELLO_API_TOKEN not configured in GitHub Secrets. Skipping Trello sync.")
              sys.exit(0)

          # Clean diacritics / common typos in branch or title
          clean_text = pr_title.replace('fĩ', 'fix').replace('fì', 'fix') + ' ' + pr_branch

          # Extract canonical role tags (FE-46, BE-15, OPS-35, QA-20, etc.)
          full_text_to_scan = clean_text + (" " + pr_body if pr_base == "staging" else "")
          card_tags = list(dict.fromkeys(m.upper() for m in re.findall(r"\b((?:FE|BE|OPS|QA|AI|PM)-\d+)\b", full_text_to_scan, re.IGNORECASE)))
          issue_numbers = list(dict.fromkeys(re.findall(r"(?:ISSUE[\s\-_]*#?|#)(\d+)\b", full_text_to_scan, re.IGNORECASE)))

          print(f"Extracted info: Base='{pr_base}', CardTags={card_tags}, IssueNumbers={issue_numbers}")

          if not card_tags and not issue_numbers:
              print(f"No card tag matching (FE|BE|OPS|QA|AI|PM)-NUM or Issue numbers found in: '{pr_title}' / '{pr_branch}'")
              sys.exit(0)

          def trello_request(endpoint, method="GET", params=None, data=None):
              base = "https://api.trello.com/1"
              query = {"key": api_key, "token": api_token}
              if params:
                  query.update(params)
              url = f"{base}{endpoint}?{urllib.parse.urlencode(query)}"
              
              payload = None
              headers = {"Accept": "application/json"}
              if data:
                  payload = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = "application/json"
                  
              req = urllib.request.Request(url, data=payload, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      if response.status in (200, 201):
                          res_body = response.read().decode("utf-8")
                          return json.loads(res_body) if res_body else {}
                      return {}
              except urllib.error.HTTPError as e:
                  print(f"HTTPError: {e.code} - {e.read().decode('utf-8')}")
                  return None
              except Exception as e:
                  print(f"Request error: {e}")
                  return None

          # Fetch lists on the board
          lists = trello_request(f"/boards/{board_id}/lists")
          if not lists:
              print(f"Failed to fetch lists for board {board_id}")
              sys.exit(0)

          review_list = next((l for l in lists if "review" in l["name"].lower()), None)
          testing_list = next((l for l in lists if l["name"].strip().lower() == "testing"), None)

          if not review_list:
              print("Could not find a 'Review' list on the Trello board.")

          # Fetch cards on the board
          cards = trello_request(f"/boards/{board_id}/cards")
          if not cards:
              print(f"Failed to fetch cards for board {board_id}")
              sys.exit(0)

          def find_cards_for_tag_and_issues(tag, inums):
              matched = []
              # Tier 1: Canonical [ROLE-NUM] match in card title
              if tag:
                  t1 = [c for c in cards if f"[{tag}]" in c["name"].upper() or f" {tag} " in f" {c['name'].upper()} "]
                  matched.extend(t1)

              # Tier 2: Match by GitHub Issue number in card title
              if inums:
                  for inum in inums:
                      pattern = re.compile(rf"#\b{inum}\b")
                      t2 = [c for c in cards if pattern.search(c["name"]) and c not in matched]
                      matched.extend(t2)

              # Tier 3: Match legacy role tag in card description
              if tag and not matched:
                  t3 = [c for c in cards if f"[{tag}]" in c.get("desc", "").upper() or f"`{tag}`" in c.get("desc", "").upper()]
                  matched.extend(t3)

              return matched

          matched_cards = {}
          for tag in card_tags:
              for c in find_cards_for_tag_and_issues(tag, issue_numbers):
                  matched_cards[c["id"]] = c

          if not matched_cards and issue_numbers:
              for c in find_cards_for_tag_and_issues(None, issue_numbers):
                  matched_cards[c["id"]] = c

          if not matched_cards:
              print(f"No cards matching tags {card_tags} or issues {issue_numbers} found on board.")
              sys.exit(0)

          print(f"Found {len(matched_cards)} matching card(s): {[c['name'] for c in matched_cards.values()]}")

          for card_id, target_card in matched_cards.items():
              card_name = target_card["name"]
              # Attach PR URL if not already attached
              attachments = trello_request(f"/cards/{card_id}/attachments") or []
              already_attached = any(pr_url in (att.get("url") or "") for att in attachments)
              if not already_attached and pr_url:
                  print(f"Attaching PR link {pr_url} to card '{card_name}'...")
                  trello_request(f"/cards/{card_id}/attachments", method="POST", data={"url": pr_url, "name": f"GitHub PR #{pr_number}"})

              if pr_base == "develop":
                  if pr_action in ("opened", "reopened", "ready_for_review"):
                      # Move to Review list (NOT Testing)
                      if review_list and target_card.get("idList") != review_list["id"]:
                          print(f"Moving card '{card_name}' to '{review_list['name']}' list...")
                          trello_request(f"/cards/{card_id}", method="PUT", data={"idList": review_list["id"]})

                      comment = f"Developer @{pr_user} opened PR #{pr_number} ({pr_url}). Moved to 'Review' for code review and staging merge approval!"
                      print(f"Posting Review notification comment to '{card_name}'...")
                      trello_request(f"/cards/{card_id}/actions/comments", method="POST", data={"text": comment})

                  elif pr_action == "closed" and pr_merged:
                      # Card remains in Review until deployed to Staging
                      comment = f"PR #{pr_number} has been merged into develop branch ({pr_url}) by @{pr_user}. Card remains in 'Review' awaiting deployment to Staging."
                      print(f"Posting develop merge comment to '{card_name}'...")
                      trello_request(f"/cards/{card_id}/actions/comments", method="POST", data={"text": comment})

              elif pr_base == "staging":
                  if pr_action == "closed" and pr_merged:
                      # Code is now merged to staging -> Move to Testing and tag Tester!
                      if testing_list and target_card.get("idList") != testing_list["id"]:
                          print(f"Moving card '{card_name}' to '{testing_list['name']}' list...")
                          trello_request(f"/cards/{card_id}", method="PUT", data={"idList": testing_list["id"]})

                      comment = f"@zawntsu Changes have been promoted and deployed to Staging via PR #{pr_number} ({pr_url}). Moved to 'Testing' list for QA verification!"
                      print(f"Posting Staging deployment comment to '{card_name}'...")
                      trello_request(f"/cards/{card_id}/actions/comments", method="POST", data={"text": comment})

          print("Trello sync completed successfully.")
          EOF
