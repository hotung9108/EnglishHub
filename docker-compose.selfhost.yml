services:
  postgres:
    image: postgres:16-alpine
    container_name: englishhub-postgres-selfhost
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-englishhub_db}
      POSTGRES_USER: ${DB_USER:-englishhub_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_selfhost_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-englishhub_admin} -d ${DB_NAME:-englishhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - englishhub_selfhost_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: englishhub-backend-selfhost
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-englishhub_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-englishhub_admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT Secret is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - englishhub_selfhost_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: englishhub-frontend-selfhost
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - englishhub_selfhost_net

  # Khối dịch vụ Cloudflare Tunnel tùy chọn (giúp truy cập từ ngoài Internet không cần mở port modem)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: englishhub-tunnel-selfhost
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    networks:
      - englishhub_selfhost_net
    profiles:
      - cloudflare

networks:
  englishhub_selfhost_net:
    driver: bridge

volumes:
  postgres_selfhost_data:
    driver: local
