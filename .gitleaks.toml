# Gitleaks Configuration for EnglishHub
[extend]
# Sử dụng base rule mặc định của Gitleaks

[allowlist]
description = "Bỏ qua các file cấu hình mẫu .example và file test"
paths = [
  '''(?i)env\..*\.example$''',
  '''(?i)application\.properties$''',
  '''(?i)application-.*\.properties$''',
  '''(?i)README\.md$''',
  '''(?i)docs/.*\.md$''',
  '''(?i)\.agents/.*\.md$'''
]
regexes = [
  '''devpassword''',
  '''testpassword''',
  '''SecretPassword123!''',
  '''ChangeThisToAStrongPassword123!''',
  '''englishhub-development-jwt-secret-key-32chars-min'''
]
