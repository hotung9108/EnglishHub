# ==============================================================================
# EnglishHub - Production / Staging overrides
# Active when SPRING_PROFILES_ACTIVE=prod (docker-compose.prod.yml + docker-compose.staging.yml).
#
# Only settings that must differ from application.properties belong here.
# Reason: application.properties is always loaded first, so its debug flags
# (show-sql, format_sql, web DEBUG logging) would otherwise stay enabled in prod.
# ==============================================================================

# ===== JPA / Hibernate: no debug I/O on the request path (BUG-24) =====
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Release the EntityManager and its JDBC connection before the response is
# rendered instead of holding it for the whole request.
spring.jpa.open-in-view=false

# ===== Logging =====
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

# ===== HikariCP tuned for Neon Serverless (via the -pooler endpoint) =====
# A small pool is enough for a single instance and keeps Neon compute usage low.
# keepalive-time is what prevents Neon from silently dropping idle connections,
# which otherwise costs a full TCP + TLS handshake on the next request.
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

# ===== HTTP response compression =====
# Large list/detail payloads travel over the Cloudflare Tunnel; compressing them
# cuts transfer time on slow client links.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=2048
