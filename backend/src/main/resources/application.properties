spring.application.name=english_hub_backend

server.port=8080

# ===== Datasource: Postgres chạy local qua docker-compose.dev.yml =====
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:appdb}
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Dev tools =====
spring.devtools.restart.enabled=true

# ===== Logging =====
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
