spring.application.name=english_hub_backend_core

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# ===== Datasource: Postgres chạy local qua docker-compose.dev.yml =====
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:appdb}
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Dev tools =====
spring.devtools.restart.enabled=true

# ===== Logging =====
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

# ===== API security =====
# The auth module and this module must use the same secret to validate JWT access tokens.
app.security.jwt-secret=${JWT_SECRET:englishhub-development-jwt-secret-change-me-please}
app.security.jwt-issuer=${JWT_ISSUER:englishhub}
app.security.access-token-ttl-seconds=${ACCESS_TOKEN_TTL_SECONDS:900}
app.security.refresh-token-ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:604800}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===== Object storage (S3-compatible: Cloudflare R2, NeonDB Storage, MinIO, AWS S3) =====
# Switching provider only requires changing endpoint + credentials + bucket.
app.storage.s3.enabled=${STORAGE_S3_ENABLED:false}
app.storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
app.storage.s3.region=${STORAGE_S3_REGION:auto}
app.storage.s3.access-key-id=${STORAGE_S3_ACCESS_KEY_ID:minioadmin}
app.storage.s3.secret-access-key=${STORAGE_S3_SECRET_ACCESS_KEY:minioadmin}
app.storage.s3.bucket=${STORAGE_S3_BUCKET:englishhub-dev}
app.storage.s3.path-style=${STORAGE_S3_PATH_STYLE:true}

# ===== AI Service (FastAPI Microservice) =====
app.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8001}
app.ai-service.connect-timeout-seconds=${AI_SERVICE_CONNECT_TIMEOUT_SECONDS:5}
app.ai-service.read-timeout-seconds=${AI_SERVICE_READ_TIMEOUT_SECONDS:60}
app.ai-service.model=${AI_SERVICE_MODEL:}
app.ai-service.provider=${AI_SERVICE_PROVIDER:}
app.ai-service.internal-secret=${INTERNAL_SECRET:}

# ===== Outbound email (EmailJS REST provider) =====
# Set EMAIL_ENABLED=true and provide the EmailJS identifiers/keys to deliver mail.
# The private key is a secret and must come from the environment only.
app.email.enabled=${EMAIL_ENABLED:false}
app.email.emailjs.base-url=${EMAILJS_BASE_URL:https://api.emailjs.com}
app.email.emailjs.service-id=${EMAILJS_SERVICE_ID:}
app.email.emailjs.password-reset-template-id=${EMAILJS_PASSWORD_RESET_TEMPLATE_ID:}
app.email.emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
app.email.emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
app.email.emailjs.timeout-seconds=${EMAILJS_TIMEOUT_SECONDS:10}

# ===== Frontend links used inside emails =====
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

