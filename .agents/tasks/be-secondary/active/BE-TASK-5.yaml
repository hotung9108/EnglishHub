description: "Implement the 8 class/class-membership endpoints per .agents/private/plans/class_api_implementation_plan.md on branch feat/class-api. Stage 0 (scaffolding) complete. Phase 1 (read APIs #12,#14) complete. Phase 2 (write APIs #13,#15,#16) complete. Phase 3 (membership APIs #17,#18,#19) complete: ClassService.listClassMembers (404 unknown class, roster via ClassMemberRepository.findMembersWithStudentInfo, sorted by memberId asc), addClassMember (400 Thiếu mã học viên., 404 Không tìm thấy lớp học hoặc học viên., 409 Học viên đã có trong lớp., returns new memberId), removeClassMember (findByClassIdAndId scoped to class else 404 Không tìm thấy thành viên trong lớp., hard delete); ClassController GET/POST /classes/{id}/members + DELETE /classes/{id}/members/{memberId}; new domain record ClassMemberDetail, ClassMemberRepository.findMembersWithStudentInfo in ClassMemberJpaAdapter (fetch-join via infra StudentProfileRepository.findAllActiveWithUserByIds excluding soft-deleted users per decision), ClassRepository.studentExists in ClassJpaAdapter via StudentProfileRepository.existsById; DTOs AddClassMemberRequest, ClassMemberResponse, ClassMemberListResponse (no pagination), AddedClassMemberResponse (includes memberId per decision). Phase 3 DoD verified: tests ClassServiceTest (37) + ClassControllerTest (10) passing; full suite 118 tests green. Phase 4 (integration/hardening/contract) pending on owner go-ahead. Decisions: role checks skipped (security layer owns 401/403; only #12 data-scoping in service); module-owned persistence; infra ClassStatus enum reused; plan-open items A-E defaulted (date-range 400, teacher-404 on update, empty-update 400, count-all-related-data on delete, service-level duplicate check for #18); #18 201 includes memberId; #17 excludes soft-deleted students; NO unique index on (class_id, student_id) — concurrent duplicate #18 surfaces as 500 via GlobalExceptionHandler (known gap for Phase 4)."