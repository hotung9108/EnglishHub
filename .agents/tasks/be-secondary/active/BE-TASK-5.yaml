description: "Implement the 8 class/class-membership endpoints per .agents/private/plans/class_api_implementation_plan.md on branch feat/class-api. Stage 0 (scaffolding) complete. Phase 1 (read APIs #12 list + #14 detail) complete: ClassService.listClasses (Admin/Teacher/Student scoping via CurrentUserProvider, status filter, page/limit validation) and getClassDetail (404 unknown class, teacher lookup, memberCount); ClassController GET /api/v1/classes + GET /classes/{id} with DTOs; ClassRepository.findPage/findTeacher in ClassJpaAdapter (Specification + exists-subquery for STUDENT scoping); TeacherInfo domain record. Phase 2 (write APIs #13 create + #15 update + #16 delete) complete: ClassService.createClass (required name/startDate, name<=150/level<=50, endDate>=startDate, teacherId exists in teacher_profiles, default ACTIVE), updateClass (404 unknown class, empty-body 400, status enum validation, date-range vs stored startDate, teacherId reassignment, refreshes persisted entity), deleteClass (409 if any class_members/assignments/student_evaluations via ClassRepository.hasRelatedData same-transaction check, else hard delete); ClassController POST /classes, PUT /classes/{id}, DELETE /classes/{id} + DTOs (CreateClassRequest, UpdateClassRequest, CreatedClassResponse, MessageResponse); ClassRepository port gained teacherExists/hasRelatedData implemented in ClassJpaAdapter via infra TeacherProfileRepository/AssignmentRepository/StudentEvaluationRepository (added existsByClassId). Phase 2 DoD verified: tests ClassServiceTest (27) + ClassControllerTest (7) passing; full suite 105 tests green. Phases 3 (#17,#18,#19) + 4 (integration/contract) pending on owner go-ahead. Decisions: role checks skipped (security layer owns 401/403; only #12 data-scoping in service); module-owned persistence; infra ClassStatus enum reused; plan-open items A-E defaulted (date-range 400, teacher-404 on update, empty-update 400, count-all-related-data on delete, service-level duplicate check for #18 later); unique index on (class_id, student_id) NOT added (decision E pendant for Phase 3)."