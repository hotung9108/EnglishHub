id: BE-TASK-6
title: "Implement Submissions and Answers APIs"
assignee: "@be-secondary"
status: "In Progress"
progress: "Phase 1 (persistence) DONE on feat/submissions-answers-api: modules/submission DDD ports+adapters (SubmissionRepository, SubmissionModuleRepository, GradingRepository) with Testcontainers integration test (7 tests, 134 total green). Phase 2 (API #37 start attempt) next."
