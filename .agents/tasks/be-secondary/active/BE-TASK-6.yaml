id: BE-TASK-6
title: "Implement Submissions and Answers APIs"
assignee: "@be-secondary"
status: "In Progress"
progress: "Phase 1 (persistence) DONE on feat/submissions-answers-api: modules/submission DDD ports+adapters (SubmissionRepository, SubmissionModuleRepository, GradingRepository) with Testcontainers integration test (7 tests, 156 total green). Phase 2 (API #37 POST /api/v1/assignments/{id}/submissions start attempt) DONE: read-only submission-context ports + JPA adapters (AssignmentWindowRepository, AssignmentModuleRepository, StudentClassEnrollmentRepository), SubmissionService.startAttempt with role/membership/status/window/max-submissions guards + AUTO/TEACHER_MANUAL grading draft mapping, SubmissionController 201 response per V4 chapter 6 (id, assignmentId, attemptNumber, status, createdAt, modules[id,moduleId,skill,status]); shared Submission entity now maps created_at/updated_at; full suite 156 tests green (11 service + 1 controller + 10 API integration). Phase 3 (READ #38 GET /submissions/{id} + #39 GET /submissions) DONE per V4 contract: domain Grading extended with aiFeedback/finalFeedback; new ClassTeachingRepository port + ClassTeachingJpaAdapter; Scoring: STUDENT sees only own (403 on foreign studentId), TEACHER requires assignmentId (400) + must teach the class (403 otherwise), ADMIN unfiltered; SubmissionService.getById + list compose modules ordered by orderIndex with grading detail/summary; controller GET /submissions/{id} and GET /submissions with pagination; 190 tests green (26 service + 3 controller + 26 API integration). Phase 4 (API #43 POST /api/v1/submission-modules/{id}/submit for QUIZ + REWRITE) DONE per V4 contract: new Answer domain/port/adapter (bulkCreate, findBySubmissionModuleId) + ModuleQuestion port/adapter (findByModuleIdOrderByOrderIndexAsc); SubmissionService.submitModule guards (STUDENT only, module IN_PROGRESS else 400 already-submitted, ownership 403, ESSAY/RECORDING 400 unsupported until Phase 8 R2) + per-question-type content-shape validation (MULTIPLE_CHOICE selectedOptionIds array, SHORT_ANSWER non-blank text; missing/empty/duplicate answers or wrong shape -> 400 invalid, unknown question/module -> 404 combined); persists answers then flips module status to SUBMITTED; controller returns 200 {message, submissionModuleId, status, answers[id,questionId,content]}; full suite 214 tests green (40 service + 4 controller + 35 API integration). Phase 5 (API #40 POST /api/v1/submissions/{id}/submit final submit) DONE per V4 contract: SubmissionService.submit locks submissions.status -> SUBMITTED + submitted_at=now() and flips every still-IN_PROGRESS submission_module -> SUBMITTED (already-submitted modules and their answers untouched); guards STUDENT only (403), unknown 404, owner 403, status != IN_PROGRESS 400 'Bài làm này đã được nộp.'; response 200 {message:'Nộp bài thành công.', status:'SUBMITTED', submittedAt}; auto-grading/scoring deliberately OUT of scope (separate feature) - gradings left PENDING with finalScore null; new SubmitResponse DTO; full suite 229 tests green (48 service + 5 controller + 42 API integration). Phase 6 (API #42 GET /api/v1/submission-modules/{id} module detail) DONE per V4 contract: new QuestionDetail read model + ModuleQuestionRepository.findDetailsByModuleId (content + serialized correct_answer) implemented in ModuleQuestionJpaAdapter; SubmissionService.getModuleDetail composes skill/taskType (via modulesOf), grading detail (reused GradingDetailResult), questions with correctAnswer parsed ONLY when submission_module.status == GRADED else null, and answers {id, questionId, content} re-parsed from stored JSON; visibility = existing verifyReadAccess (student-owner / class-teacher / admin) with 403, unknown module or missing parent submission -> 404 'Không tìm thấy phần làm bài.'; Essay/Speaking -> questions[] + answers[] empty (file-metadata shape deferred to Phase 8 uploads); SubmissionService now injects tools.jackson ObjectMapper for JSON parsing; controller GET /submission-modules/{id} with new SubmissionModuleDetailResponse + QuestionResponse + AnswerDetailResponse DTOs; full suite 248 tests green (59 service + 6 controller + 49 API integration). Phases 7-8 (APIs #46/#47 presigned uploads, #43 Writing/Speaking R2 submit) next."
priority: "High"
description: "Implement the submission and answers API cluster following the DDD/service-layer rules and the V6 schema: create student submissions against an open assignment with a student_evaluations linkage, submit answers (listening/speaking/reading/writing) referencing questions and modules, list/get submissions, get submission details with answers, and update/correct answers. Enforce role scoping and ownership (student can only submit within their enrollment/class and only while assignment is OPEN; teacher/admin visibility rules), validate answer payloads, score, and JSON correct_answer at the service layer, use JPA rather than raw SQL/JDBC, add unit/integration tests, and place tester handoff instructions in production_artifacts/be_to_tester/."