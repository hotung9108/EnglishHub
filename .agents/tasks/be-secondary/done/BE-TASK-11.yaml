id: BE-TASK-11
title: "Distinguish submission answer content types for MULTIPLE_CHOICE vs SHORT_ANSWER"
assignee: "@be-secondary"
status: "Done"
progress: "DONE on feature/distinct-answers-api. Mirrors the CorrectAnswer typed contract from d7462d1, applied to the submit path. New package modules/submission/presentation/rest/dto/answercontent/ with AnswerContent (sealed, permits MultipleChoiceAnswerContent, ShortAnswerAnswerContent), MultipleChoiceAnswerContent(List<Long> selectedOptionIds), ShortAnswerAnswerContent(String text) and AnswerContentDeserializer (ValueDeserializer, resolves subtype from payload shape because the wire contract carries no discriminator field). Wire format UNCHANGED - no discriminator added, no key renamed. AnswerContent exposes questionType() so the service can still reject a shape that does not match the question's type; that guarantee is the reason shape-sniffing alone was not enough. SubmitModuleRequest.AnswerPayload.content is now AnswerContent with @JsonDeserialize(using=AnswerContentDeserializer.class) + @Valid + @NotNull, and SubmitModuleRequest.answers is List<@Valid AnswerPayload> - both @Valid links are required or bean validation never runs. SubmissionController gained @Valid and projects questionType() + toMap() onto the service payload. SubmissionService.AnswerPayload is now (Long questionId, QuestionType questionType, Map<String,Object> content); the 23-line validateAnswerContentShape JsonNode switch is replaced by a one-line questionType cross-check, JsonNode.toString() by objectMapper.writeValueAsString, and AnswerResult.content by objectMapper.valueToTree. GlobalExceptionHandler.findCorrectAnswerShapeMessage generalized to findShapeMessage over a prefix list so the new specific 400 message surfaces. READ PATH DELIBERATELY UNTOUCHED: AnswerResult.content, AnswerDetailResponse.content and SubmitModuleResponse.AnswerResponse.content stay JsonNode, so seeded legacy rows keep their snake_case selected_option_ids/answer_text plus is_correct/score extras and still round-trip verbatim; persistence unchanged (answers.content stays JSONB with camelCase keys). Tests: 2 new classes (AnswerContentDeserializerTest 10, AnswerContentValidationTest 10 incl. 2 cascade guards); SubmissionServiceTest shape tests replaced by submitModuleRejectsAnAnswerWhoseShapeDoesNotMatchTheQuestionType + submitModuleRejectsAnAnswerWithNoClaimedQuestionType, helpers multipleChoice/shortAnswer now build AnswerPayload directly (78 tests); SubmissionControllerTest +2 (payload projection captured via ArgumentCaptor, null-payload passthrough); SubmissionApiIntegrationTest +5 (unrecognised shape, empty selection, non-positive option id, blank-text ordering, null content). Full suite 526 green. Client-visible change is error granularity only - 5 new 400 messages, all previously 400, no status-code change. Docs: Hợp đồng content section added to api_overview_v3.md CỤM 5, full 400 table in api_v4_design_chapter_6_submissions_answers.md, handoff at production_artifacts/be_to_tester/submissions-answer-content-testing-instructions.md."
priority: "Medium"
description: "Replace the untyped JsonNode AnswerPayload.content in the submission module's submit path with a sealed interface permitting one subtype per supported question type (MULTIPLE_CHOICE, SHORT_ANSWER), following the same shape-sniffing deserializer pattern already used for the question module's correctAnswer in d7462d1. Keep the wire contract backward compatible, move shape detection and field validation out of the JsonNode-sniffing service switch, and preserve the guarantee that an answer's content shape must match the type of the question it was submitted for."
