id: BE-TASK-13
title: "Auto grade submitted quiz and rewrite modules asynchronously by comparing answers"
assignee: "@be-secondary"
status: "Done"
progress: "DONE. Deterministic auto grading for module submit, no migration, no wire-format change, no new endpoint. FLOW: SubmissionService publishes SubmissionModuleSubmittedEvent(submissionModuleId) after saving the SUBMITTED module; AutoGradingListener handles it on TransactionPhase.AFTER_COMMIT (scoring must not race the answer rows the submit transaction wrote); it delegates to the new AutoGradingAsyncWorker, which is the ONLY @Async boundary, and catches Throwable so nothing escapes a commit that already happened. AutoGradingServiceImpl opens its own transaction, re-resolves eligibility from canonical module enums, takes a PESSIMISTIC_WRITE lock (5s timeout) on the grading row via GradingRepository.findBySubmissionModuleIdForUpdate, and returns without scoring when the row already left PENDING - that lock plus the status check is the whole idempotency story, so a duplicate event cannot double-count. Scores with AutoGrader (pure static domain), writes verdicts through the new AutoGradedAnswers port, flips the grading to AUTO/COMPLETED with modules.max_score as max_score_snapshot, and marks the submission module GRADED. Answer verdicts are merged into the existing answers.content JSONB as camelCase isCorrect/score via Answer.applyGradingOutcome rather than replacing the payload. COMPARISON: MULTIPLE_CHOICE compares the set of selected option ids against the ids flagged isCorrect (numeric, so Integer and Long widths agree; extra or missing selections are wrong); SHORT_ANSWER compares after NFC folding, trim, internal-whitespace collapse and Locale.ROOT lowercasing, with punctuation deliberately significant because the teacher authored the expected string. Unanswered questions score 0 rather than failing, since partial submissions are legal. The awarded total is capped at the module max score because nothing constrains SUM(questions.score) to that value. THREE ARCHITECTURE DECISIONS WORTH FLAGGING. (1) AutoGradeEligibility moved from the grading context to the module context: it had to be shared by SubmissionService (which resolves gradingMethod at attempt start) and the grading service, but grading already depends on submission, so sharing it from grading would have closed a submission <-> grading import cycle. The module context depends on nothing, so both consumers point at it and the graph stays a DAG - verified by grepping cross-context imports. (2) Eligibility is enumerated PER SKILL (a switch), not as an independent set of skills x task types: the set form accepted LISTENING + REWRITE, which ModuleService refuses to create, so gradingMethodOf would have labelled such a module AUTO and then the grader would have tried to score it. Caught by a unit test that stubbed no grading row and got an unexpected IllegalStateException. (3) The async boundary is a separate bean rather than @Async on the listener: with @Async on the listener, Spring's async proxy submits the task before the listener body runs, so an executor rejection is thrown from inside the listener's own commit and CANNOT be caught by its try/catch. With the split, the listener's call is synchronous and a rejection surfaces to it. AutoGradingFailureRecorder uses REQUIRES_NEW because the grading transaction is already rolled back by the time it runs, and the recorder itself failing is swallowed and logged rather than propagated. ELIGIBILITY also corrected a latent bug: GradingContextJpaAdapter derived 'submitted' from the parent submission.submittedAt, which only the official submit sets, so a per-module submit reported submitted=false and grading would always have skipped. It now reads submissionModule.status != IN_PROGRESS. CLIENT-VISIBLE CHANGES: (a) READING + REWRITE is now a valid module pair in ModuleService.isSupportedPair; (b) REWRITE no longer accepts document upload, so getDocumentUploadUrl is ESSAY-only and a REWRITE module gets the existing 400. SubmissionService.gradingMethodOf also stopped special-casing QUIZ and now goes through AutoGradeEligibility, so a module can never be labelled AUTO but left ungraded. TESTS: 4 new classes - AnswerComparatorTest (26), AutoGraderTest (9), AutoGradingServiceTest (10), AutoGradingListenerTest (4) - plus AutoGradingIntegrationTest (9, Testcontainers, deliberately WITHOUT class-level @Transactional because that would roll back without committing and AFTER_COMMIT would never fire; it awaits with Awaitility and supplies a stub StorageService via @TestConfiguration so essay modules can be submitted at all, since UnavailableStorageService otherwise 500s them). Existing tests updated: SubmissionServiceTest +event assertion, ModuleServiceTest +2 pair cases, SubmissionServiceTest.getDocumentUploadUrl_mapsDocxAndAcceptsRewrite replaced by getDocumentUploadUrl_rejectsRewriteBecauseRewriteIsAnsweredWithQuestions, GradingServiceTest GradingContext constructor calls. Full suite 666 green, ./gradlew build passes. Docs: auto-grading section in docs/api/api_v4_design_chapter_6_submissions_answers.md 6.6 plus corrections to 6.4 and 6.8, and production_artifacts/be_to_tester/auto-grading-testing-instructions.md. NOTE for @tester: the existing GradingAiAnalysisServiceImpl remains a stub and is untouched by this task, so WRITING and SPEAKING still have no working grading path."
priority: "High"
description: "Grade submitted assignment modules deterministically by comparing submitted answers against questions.correct_answer, asynchronously after the submit transaction commits, so the student's request never waits for scoring. Cover READING/LISTENING with QUIZ/REWRITE, record the per-question verdict on the answer, and leave teacher-graded modules untouched."