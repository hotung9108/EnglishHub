id: BE-TASK-12
title: "Validate submission and submission-module states on submit, upload-url and module-detail endpoints"
assignee: "@be-secondary"
status: "Done"
progress: "DONE. Module com.english_hub.core.modules.submission (SubmissionService only - no DTO, no persistence, no migration, no wire-format change). FOUR guards added, all returning 400 with the module's existing Vietnamese messages where one already existed: (1) submitModule (#43) previously checked ONLY submissionModule.status != IN_PROGRESS, so a module left IN_PROGRESS could still be submitted after its parent submission was finalised; it now also rejects submission.status != IN_PROGRESS with the existing ALREADY_FINISHED_MESSAGE 'Bài làm này đã được nộp.' - the guard sits AFTER the ownership check so a foreign student still gets 403, and AFTER the module guard so the module-level message keeps priority. (2) getAudioUploadUrl (#46) and getDocumentUploadUrl (#47) called requireOwnModule, which loads the parent submission but never inspects its status; they now go through a new private requireEditableModule(id, message) that layers 'parent submission must be IN_PROGRESS' on top of requireOwnModule and reuses the endpoint's own AUDIO_UPLOAD_MESSAGE / DOCUMENT_UPLOAD_MESSAGE, so a finalised attempt can no longer obtain a presigned URL. (3) getModuleDetail (#42) had no status gate at all - it returned 200 for an IN_PROGRESS module, which is the documented Phase-6 behaviour; it now 400s with a new NOT_SUBMITTED_YET_MESSAGE 'Phần làm bài chưa được nộp.' unless BOTH the module and the parent submission are SUBMITTED or GRADED, via a private isSubmittedOrGraded(SubmissionStatus) helper. Guard order in #42 is deliberate: 404 (missing) -> 403 (verifyReadAccess) -> 400 (state), so non-owners keep getting 403 rather than leaking existence-by-state. submit (#40) is UNCHANGED per product decision: it still force-flips every remaining IN_PROGRESS module to SUBMITTED, and its submission.status != IN_PROGRESS guard already covered the 'already submitted' case. NOTE the BREAKING change: #42 no longer serves an IN_PROGRESS module; resuming an attempt must go through #38 GET /submissions/{id}, which has no state gate and still returns modules[] with statuses. Test fixture helpers were the main cost: the shared submission()/module() helpers hard-coded IN_PROGRESS, so seven getModuleDetail cases were rewritten to SUBMITTED/GRADED variants (getModuleDetailHidesCorrectAnswersUntilGraded renamed to ...WhileSubmitted) and the 403/404 cases were deliberately left on IN_PROGRESS fixtures to pin the guard ordering. Five new service cases cover the new guards; getModuleDetailRevealsCorrectAnswersWhenGraded now runs under a GRADED parent and getModuleDetailKeepsCorrectAnswerHiddenWhenSubmitted under a GRADED parent with a SUBMITTED module to keep the cross-status path covered. Three new API integration cases pin #42 and #43, and three in the upload-url suite pin #43/#46/#47 after #40 - each resets the module back to IN_PROGRESS so the parent guard, not the pre-existing module guard, is the one under test. Docs updated: docs/api/api_v4_design_chapter_6_submissions_answers.md (#42 description, IN_PROGRESS 200 example replaced with the SUBMITTED one, 400 rows added to #42/#43/#46/#47, constraint sentences amended), plus a new production_artifacts/be_to_tester/submissions-state-validation-testing.md and corrections to the two stale smoke flows in submissions-answer-content-testing-instructions.md and submissions-api-phase1-testing.md that read #42 on an open attempt."
priority: "Medium"
description: "Close the missing parent-submission state validations in the submission module: (1) neither submit-module nor the two presigned-upload-url endpoints may act once the parent submission is no longer IN_PROGRESS; (2) reading a submission module by id must be rejected while either the module or its parent submission is still IN_PROGRESS; (3) keep the official submit's existing force-flip of unsubmitted modules, and express every new rejection as 400 reusing the module's established Vietnamese error messages."
