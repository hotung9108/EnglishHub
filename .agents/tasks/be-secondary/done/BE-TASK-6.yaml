ponse DTOs; full suite 252 tests green (59 service + 6 controller + 49 API integration + 4 storage). Phase 7a (S3-compatible storage layer) DONE: application/port/StorageService (generatePresignedPutUrl + objectExists, 15-min static TTL); infrastructure/storage {StorageProperties(app.storage.s3.*), S3StorageConfiguration with conditional beans - S3StorageService when app.storage.s3.enabled=true (AWS SDK v2 S3Client+S3Presigner, endpointOverride + path-style) else UnavailableStorageService fallback so the app boots with no credentials}; provider-agnostic - Cloudflare R2 / NeonDB Storage / MinIO / AWS S3 swap via credentials only; build.gradle imports software.amazon.awssdk:bom:2.55.4; MinIO Testcontainers round-trip test (presign -> direct HTTP PUT -> objectExists) + UnavailableStorageService tests; full suite 252 tests green (4 new). Phase 7b (endpoints #46/#47 presigned upload URLs) DONE: SubmissionService.getAudioUploadUrl/getDocumentUploadUrl with student/owner/module-exists (404 Không tìm thấy phần làm bài.)/IN_PROGRESS guards + task-type/skill bounds (SPEAKING|RECORDING for audio, ESSAY|REWRITE for document) and MIME->extension derivation (audio/webm|audio/mpeg|audio/wav -> webm|mp3|wav, pdf/docx for documents else 400 Định dạng file không được hỗ trợ.), storage keys submissions/{submissionId}/module-{submissionModuleId}/audio.{ext} and /essay.{ext}; StorageService injected (12th dep); controller POST /submission-modules/{id}/audio-upload-url + /document-upload-url with UploadUrlRequest/UploadUrlResponse DTOs returning {uploadUrl, storageKey, expiresAt} 200; full suite 276 tests green (+14 service +2 controller +8 API integration via new SubmissionUploadUrlApiIntegrationTest with MinIO e2e incl. real HTTP PUT to the presigned URL + objectExists). Phase 8 (#43 Writing/Speaking R2 submit) next." —> Now DONE:

