description: "Thiết lập hệ thống CI Quality Gates tự động trên GitHub Actions và cấu hình GitHub Ruleset bảo vệ 3 tầng để đảm bảo chất lượng đầu ra của dự án, chặn code lỗi/chưa đạt độ phủ 80% merge vào develop, kiểm soát quy chuẩn PR/Commit, đồng thời phân quyền merge an toàn tuyệt đối không làm mất nhánh develop/staging/main."
