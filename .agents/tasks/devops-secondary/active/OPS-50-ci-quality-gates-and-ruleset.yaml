acceptance_criteria:
  - "Thành viên thông thường không thể tự merge PR khi chưa có 1 phê duyệt từ Tester hoặc Admin."
  - "Admin (@hotung9108) có quyền merge PR của chính mình mà không bị chặn bởi điều kiện review."
  - "3 nhánh cốt lõi (main, develop, staging) được bảo vệ tuyệt đối: không ai có thể xóa hoặc force-push."
  - "PR vi phạm quy chuẩn tiêu đề hoặc tên nhánh bị CI chặn ngay lập tức."
  - "Backend CI chặn merge nếu JaCoCo coverage dưới 80%."
  - "Frontend CI kiểm tra ESLint, TypeScript và Vitest coverage > 80%."
  - "AI Service CI kiểm tra ruff/flake8 và pytest coverage > 80%."
